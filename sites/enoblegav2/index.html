<body>

    <nav class="navbar" aria-label="Navegación principal">
        <div class="navbar-inner">
            <a class="navbar-brand" href="#top">
                <span class="navbar-prompt">$</span>
                esteban@enoblega
            </a>

            <button
                class="navbar-toggle"
                aria-label="Abrir menú de navegación"
                aria-expanded="false"
                aria-controls="navbar-links"
            >
                <span></span><span></span><span></span>
            </button>

            <ul class="navbar-links" id="navbar-links">
                <li><a href="#about">about</a></li>
                <li><a href="#skills">skills</a></li>
                <li><a href="#experience">experience</a></li>
                <li><a href="#projects">projects</a></li>

                <header class="terminal-header">
                    <div class="traffic-lights" aria-hidden="true">
                        <span class="traffic-light close"></span>
                        <span class="traffic-light minimize"></span>
                        <span class="traffic-light maximize"></span>
                    </div>
                    <div class="terminal-title">esteban@enoblega: ~</div>
                </header>

                <section class="terminal-body"></section>

            </div>
        </section>

        <!-- ===================== LANDING SECTIONS ===================== -->
        <div class="landing">

            <section id="about" class="landing-section">
                <h2 class="landing-title"><span class="landing-prompt">$</span> whoami</h2>
                <div class="landing-body about-body"></div>
            </section>

            <section id="skills" class="landing-section">
                <h2 class="landing-title"><span class="landing-prompt">$</span> skills</h2>

            </section>

            <section id="experience" class="landing-section">
                <h2 class="landing-title"><span class="landing-prompt">$</span> experience</h2>

            </section>

            <section id="projects" class="landing-section">
                <h2 class="landing-title"><span class="landing-prompt">$</span> projects</h2>

            </section>

            <section id="education" class="landing-section">
                <h2 class="landing-title"><span class="landing-prompt">$</span> education</h2>

            <section id="contact" class="landing-section">
                <h2 class="landing-title"><span class="landing-prompt">$</span> contact</h2>
                <div class="landing-body contact-body"></div>
            </section>

        </div>

        <footer class="site-footer">
            <span>esteban@enoblega.com.ar</span>
            <span class="footer-dot">·</span>
            <span>&copy; <span id="year"></span> Esteban Nóblega</span>
