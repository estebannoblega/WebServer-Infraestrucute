<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esteban Nóblega | Infrastructure Engineer</title>
    <meta name="description" content="Portfolio técnico de Esteban Nóblega — Networking, Linux, SysAdmin e infraestructura.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="terminal-window" aria-label="Terminal personal de Esteban Nóblega">

        <header class="terminal-header">
            <div class="traffic-lights" aria-hidden="true">
                <span class="traffic-light close"></span>
                <span class="traffic-light minimize"></span>
                <span class="traffic-light maximize"></span>
            </div>
            <div class="terminal-title">esteban@enoblega: ~</div>
        </header>

        <section class="terminal-body">
            <div class="terminal-line">
                <span class="prompt">$</span>
                <span class="command">whoami</span>
            </div>
            <div class="terminal-output">esteban_noblega</div>

            <div class="terminal-spacer"></div>

            <div class="terminal-line">
                <span class="prompt">$</span>
                <span class="command">hostnamectl</span>
            </div>
            <div class="terminal-output">Infrastructure Engineer · Linux SysAdmin · NOC</div>

            <div class="terminal-spacer"></div>

            <div class="terminal-line">
                <span class="prompt">$</span>
                <span class="command">skills --list</span>
            </div>
            <div class="terminal-output skills-preview">
                docker nginx proxmox linux networking bgp ospf tcp/ip datacenter troubleshooting
            </div>

            <div class="terminal-spacer"></div>

            <div class="terminal-line">
                <span class="prompt">$</span>
                <span class="command">uptime</span>
            </div>
            <div class="terminal-output">
                learning infrastructure 24/7
                <span class="cursor" aria-hidden="true"></span>
            </div>

            <div class="terminal-spacer"></div>

            <div class="terminal-line">
                <span class="prompt">$</span>
                <span class="terminal-input-placeholder">type 'help' to continue...</span>
            </div>
        </section>

    </main>
    <script src="js/data.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/terminal.js"></script>
</body>
</html>
