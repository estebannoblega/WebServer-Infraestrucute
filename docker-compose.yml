services:
  reverse-proxy:
    build: .
    container_name: reverse-proxy-prod

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/sites:/etc/nginx/sites:ro
      - ./conf/snippets:/etc/nginx/snippets:ro
      - ./sites:/var/www/sites:ro
      - ./certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - proxy-net

    restart: unless-stopped

networks:
  proxy-net:
    external: true