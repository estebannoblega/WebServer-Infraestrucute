events {}

http {
    server_tokens off;

	# Hardening NGINX
	client_body_timeout 10s;
	client_header_timeout 10s;
	keepalive_timeout 15s;
	send_timeout 10s;

	client_max_body_size 1M;
	
	ignore_invalid_headers on;
	reset_timedout_connection on;
	# RATE LIMIT
	limit_req_zone $binary_remote_addr zone=global:10m rate=5r/s;
	limit_conn_zone $binary_remote_addr zone=conn_limit:10m;


	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	# DEFAULT PAGE
    server {

    	listen 80 default_server;
	server_name _;

    	return 444;
    	}
	# DEFAULT HTTPS PAGE
	server{
		listen 443 ssl default_server;
		server_name _;
		ssl_reject_handshake on;	
	}	


	# IMAP - ACME CHALLENGE
	server {
	    listen 80;
	    server_name imap.enoblega.com.ar;

	    location /.well-known/acme-challenge/ {
	        root /var/www/certbot;
	    }
	
	    location / {
	        return 404;
	    }
	}
	# SMTP - ACME CHALLENGE
	server {
	    listen 80;
	    server_name smtp.enoblega.com.ar;

	    location /.well-known/acme-challenge/ {
	        root /var/www/certbot;
	    }

	    location / {
	        return 404;
	    }
	}


	# CV PAGE
    server {

        listen 80;
        server_name cv.enoblega.com.ar;
	limit_req zone=global burst=10 nodelay;
    	limit_conn conn_limit 20;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
	location ~* /\.(env|git|htaccess)$ {
    return 444;
}

location ~* /(wp-admin|wp-login|xmlrpc\.php)$ {
    return 444;
}

location ~* /(boaform|actuator|cgi-bin|vendor)$ {
    return 444;
}

location ~* \.(sql|bak|old|zip)$ {
    return 444;
}
            proxy_pass http://prueba2-ngx;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
# CV PAGE HTTPS
server {

    listen 443 ssl;
    server_name cv.enoblega.com.ar;
    limit_req zone=global burst=10 nodelay;
    limit_conn conn_limit 20;
    ssl_certificate /etc/letsencrypt/live/cv.enoblega.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv.enoblega.com.ar/privkey.pem;

    location / {

        proxy_pass http://prueba2-ngx;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
	# TEST/DOCKER PAGE
    server {

        listen 80;
        server_name docker.enoblega.com.ar;
	limit_req zone=global burst=10 nodelay;
    	limit_conn conn_limit 20;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://prueba1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
	# LAB LANDING PAGE
	server{
		listen 80;
		server_name lab.enoblega.com.ar;
		limit_req zone=global burst=10 nodelay;
    		limit_conn conn_limit 20;
		location /.well-known/acme-challenge/{
			root /var/www/certbot;
		}
		
		location / {
			#proxy_pass http://prueba1;
			#proxy_set_header Host lab.enoblega.com.ar;
			#proxy_set_header X-Real-IP $remote_addr;
			#proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 			return 301 https://$host$request_uri;
		}
	}
    # LAB LANDING PAGE HTTPS
    server {

    listen 443 ssl;
    server_name lab.enoblega.com.ar;
    limit_req zone=global burst=10 nodelay;
    limit_conn conn_limit 20;
    ssl_certificate /etc/letsencrypt/live/lab.enoblega.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.enoblega.com.ar/privkey.pem;

    location / {

        proxy_http_version 1.1;

        proxy_pass http://prueba1;

        proxy_set_header Host lab.enoblega.com.ar;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
}
