# LAB LANDING PAGE

server {
    listen 80;
    server_name lab.enoblega.com.ar;

    limit_req zone=global burst=10 nodelay;
    limit_conn conn_limit 20;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# LAB LANDING PAGE HTTPS

server {
    listen 443 ssl;
    server_name lab.enoblega.com.ar;

    limit_req zone=global burst=10 nodelay;
    limit_conn conn_limit 20;

    ssl_certificate /etc/letsencrypt/live/lab.enoblega.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.enoblega.com.ar/privkey.pem;

    location / {
        proxy_http_version 1.1;

        proxy_pass http://prueba1;

        proxy_set_header Host lab.enoblega.com.ar;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}